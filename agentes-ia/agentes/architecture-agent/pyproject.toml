[project]
name = "architecture-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-genai",
    "httpx",
    "python-dotenv>=1.2.1",
    "requests",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
