# Entorno local de Pharma Express (plan §9: reproducible con `docker compose up`).
# Solo datos sintéticos. Las pruebas de integración usan Testcontainers y no dependen de este servicio.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
      POSTGRES_DB: pharma_express
    ports:
      - "5432:5432"
    volumes:
      - pg_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma -d pharma_express"]
      interval: 5s
      retries: 10

volumes:
  pg_datos:
