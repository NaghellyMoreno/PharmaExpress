services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pharma
      POSTGRES_PASSWORD: pharma
      POSTGRES_DB: pharma_express
      TZ: America/Bogota
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharma"]
      interval: 3s
      retries: 20

  api:
    build: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pharma:pharma@db:5432/pharma_express
      TZ: America/Bogota
    ports: ["3000:3000"]
    volumes: [uploads:/app/uploads]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:3000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
